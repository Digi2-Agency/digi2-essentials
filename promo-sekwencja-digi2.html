<!-- ============================================================
     SEKWENCJA POPUPÓW — 4 s → (inna podstrona) 1 min → 3 min → 3 min → koniec

     GDZIE WKLEIĆ: Site Settings → Custom Code → Head Code,
     PO tagu loadera. Kod czeka na moduły i na DOM, więc z <head>
     działa tak samo jak z footera.

     WYMAGA loadera z modułem popups:
     <script src="https://cdn.jsdelivr.net/gh/Digi2-Agency/digi2-essentials@c14853f/dist/digi2-loader.min.js"
             d2-popups></script>

     JAK DZIAŁA ODLICZANIE
     • Krok 1 startuje 4 s po wejściu na stronę.
     • Każdy kolejny krok liczy czas OD ZAMKNIĘCIA poprzedniego popupu —
       dwa popupy nigdy nie nałożą się na siebie.
     • Zegar płynie tylko wtedy, gdy karta jest aktywna. Ktoś, kto odłożył
       kartę na godzinę, wraca do miejsca, w którym skończył.
     • Stan przeżywa przejścia między podstronami (sessionStorage).
       Nowa sesja przeglądarki = sekwencja od początku.
     • Krok 2 czeka na wejście na INNĄ podstronę i dopiero tam odlicza
       swoją minutę. Wyjście z podstrony z otwartym popupem liczy się jako
       zamknięcie — łańcuch idzie dalej.
     ============================================================ -->
<script>
(function (start) {
  function hasDigi2() { return window.digi2 && typeof window.digi2.onReady === 'function'; }

  function whenDom(fn) {
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', fn, { once: true });
    } else {
      fn();
    }
  }

  function go() { window.digi2.onReady(function () { whenDom(start); }); }

  if (hasDigi2()) return go();

  var waited = 0;
  var timer = setInterval(function () {
    if (hasDigi2()) { clearInterval(timer); go(); return; }
    waited += 50;
    if (waited >= 10000) {
      clearInterval(timer);
      console.warn('[promo] digi2 nie załadował się w 10 s — popupy nieaktywne. '
        + 'W Designer Preview to normalne (Custom Code działa dopiero po publikacji). '
        + 'Na żywej stronie sprawdź, czy loader z d2-popups stoi w Head Code PRZED tym blokiem.');
    }
  }, 50);
})(function () {

  /* ── POPUP 1 — 4 s po wejściu ────────────────────────────────
     Bez openAfterDelay: otwieraniem steruje sekwencja (niżej).
     Zostawiony trigger otwierałby ten popup na każdej podstronie
     obok łańcucha. */
  digi2.popups.create('promo', {
    popupSelector: '#popup-promo',
    closeTriggerSelector: '#popup-promo [data-popup="close"]',
    animation: 'fade',
    animationDuration: 0.5,
    cookieName: 'popup_promo_clicked',
    cookieDurationDays: 0,
    excludeUrls: ['/kontakt'],
  });

  /* ── POPUP 2 — minuta po przejściu na inną podstronę ─────────
     ⚠ Każdy popup MUSI mieć własny cookieName. Wspólna nazwa
     sprawia, że zamknięcie pierwszego oznacza resztę jako
     "widziane" i łańcuch przeskakuje na koniec. */
  digi2.popups.create('promo2', {
    popupSelector: '#popup-promo-2',
    closeTriggerSelector: '#popup-promo-2 [data-popup="close"]',
    animation: 'fade',
    animationDuration: 0.5,
    cookieName: 'popup_promo2_clicked',
    cookieDurationDays: 0,
    excludeUrls: ['/kontakt'],
  });

  /* ── POPUP 3 — 3 min po zamknięciu poprzedniego ────────────── */
  digi2.popups.create('promo3', {
    popupSelector: '#popup-promo-3',
    closeTriggerSelector: '#popup-promo-3 [data-popup="close"]',
    animation: 'fade',
    animationDuration: 0.5,
    cookieName: 'popup_promo3_clicked',
    cookieDurationDays: 0,
    excludeUrls: ['/kontakt'],
  });

  /* ── POPUP 4 — jeszcze 3 min i koniec ───────────────────────── */
  digi2.popups.create('promo4', {
    popupSelector: '#popup-promo-4',
    closeTriggerSelector: '#popup-promo-4 [data-popup="close"]',
    animation: 'fade',
    animationDuration: 0.5,
    cookieName: 'popup_promo4_clicked',
    cookieDurationDays: 0,
    excludeUrls: ['/kontakt'],
  });

  /* ── HARMONOGRAM ─────────────────────────────────────────────
     after — sekundy liczone od ZAMKNIĘCIA poprzedniego popupu
             (dla pierwszego kroku: od wejścia na stronę)
     afterPageChange — krok czeka na wejście na inną podstronę
             i dopiero tam zaczyna odliczać swoje `after` */
  digi2.popups.sequence([
    { popup: 'promo',  after: 4 },
    { popup: 'promo2', after: 60, afterPageChange: true },
    { popup: 'promo3', after: 180 },
    { popup: 'promo4', after: 180 },
  ]);

  /* ── WARIANT: ten sam popup pokazywany 4 razy ─────────────────
     Jeśli zamiast czterech treści ma wracać jeden popup, usuń
     wszystko powyżej i użyj tego:

  digi2.popups.create('promo', {
    popupSelector: '#popup-promo',
    closeTriggerSelector: '#popup-promo [data-popup="close"]',
    animation: 'fade',
    animationDuration: 0.5,
    cookieName: 'popup_promo_clicked',
    cookieDurationDays: 0,
    excludeUrls: ['/kontakt'],
    setCookieOnClose: false,     // ← bez tego zamknięcie = "widziałem"
                                 //   i kolejne kroki zostaną pominięte
  });

  digi2.popups.sequence([
    { popup: 'promo', after: 4 },
    { popup: 'promo', after: 60, afterPageChange: true },
    { popup: 'promo', after: 180 },
    { popup: 'promo', after: 180 },
  ]);
  */

  /* ── PODGLĄD W KONSOLI ───────────────────────────────────────
     digi2.debug = true    → logi modułu
     Stan łańcucha:  var seq = digi2.popups.sequence([...]); seq.status();
     seq.reset()           → zaczyna łańcuch od nowa */

});
</script>
