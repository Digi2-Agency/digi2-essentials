<!-- ============================================================
     SEKWENCJA POPUPU PROMO — jeden popup, cztery pokazy w trakcie wizyty
     4 s → (po przejściu na inną podstronę) 1 min → 3 min → 3 min → koniec

     GDZIE WKLEIĆ: Site Settings → Custom Code → Head Code,
     PO tagu loadera. Kod czeka na moduły i na DOM, więc z <head>
     działa tak samo jak z footera.

     WYMAGA loadera z modułem popups:
     <script src="https://cdn.jsdelivr.net/gh/Digi2-Agency/digi2-essentials@c14853f/dist/digi2-loader.min.js"
             d2-popups></script>

     JAK DZIAŁA ODLICZANIE
     • Pokaz 1 — 4 s po wejściu na stronę.
     • Każdy kolejny liczy czas OD ZAMKNIĘCIA poprzedniego — popup nigdy
       nie wyskoczy na sam siebie.
     • Zegar płynie tylko wtedy, gdy karta jest aktywna. Ktoś, kto odłożył
       kartę na godzinę, wraca do miejsca, w którym skończył.
     • Stan przeżywa przejścia między podstronami (sessionStorage).
       Nowa sesja przeglądarki = sekwencja od początku.
     • Pokaz 2 czeka na wejście na INNĄ podstronę i dopiero tam odlicza
       swoją minutę. Wyjście z podstrony z otwartym popupem liczy się jako
       zamknięcie — łańcuch idzie dalej.
     • Na /kontakt popup jest zablokowany (excludeUrls). Łańcuch wtedy
       CZEKA — krok nie przepada, pokaże się po wyjściu z tej podstrony.
     ============================================================ -->
<script>
(function (start) {
  function hasDigi2() { return window.digi2 && typeof window.digi2.onReady === 'function'; }

  function whenDom(fn) {
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', fn, { once: true });
    } else {
      fn();
    }
  }

  function go() { window.digi2.onReady(function () { whenDom(start); }); }

  if (hasDigi2()) return go();

  var waited = 0;
  var timer = setInterval(function () {
    if (hasDigi2()) { clearInterval(timer); go(); return; }
    waited += 50;
    if (waited >= 10000) {
      clearInterval(timer);
      console.warn('[promo] digi2 nie załadował się w 10 s — popup nieaktywny. '
        + 'W Designer Preview to normalne (Custom Code działa dopiero po publikacji). '
        + 'Na żywej stronie sprawdź, czy loader z d2-popups stoi w Head Code PRZED tym blokiem.');
    }
  }, 50);
})(function () {

  /* ── POPUP ───────────────────────────────────────────────────
     Bez openAfterDelay: otwieraniem steruje sekwencja (niżej).
     Zostawiony trigger otwierałby popup na każdej podstronie
     obok łańcucha.

     setCookieOnClose: false jest tu KLUCZOWE. Normalnie zamknięcie
     popupu znaczy "widziałem" i moduł nie pokaże go ponownie —
     wtedy pokazy 2–4 zostałyby pominięte. Z tą flagą zamknięcie
     jest tylko zamknięciem, a o tym, ile razy popup wróci,
     decyduje wyłącznie sekwencja. */
  digi2.popups.create('promo', {
    popupSelector: '#popup-promo',
    closeTriggerSelector: '#popup-promo [data-popup="close"]',
    animation: 'fade',
    animationDuration: 0.5,
    cookieName: 'popup_promo_clicked',
    cookieDurationDays: 0,
    excludeUrls: ['/kontakt'],
    setCookieOnClose: false,
  });

  /* ── HARMONOGRAM ─────────────────────────────────────────────
     after — sekundy liczone od ZAMKNIĘCIA poprzedniego pokazu
             (dla pierwszego: od wejścia na stronę)
     afterPageChange — pokaz czeka na wejście na inną podstronę
             i dopiero tam zaczyna odliczać swoje `after`

     Cztery wpisy = cztery pokazy. Chcesz piąty? Dopisz linijkę.
     Chcesz inne odstępy? Zmień liczby (to sekundy). */
  digi2.popups.sequence([
    { popup: 'promo', after: 4 },
    { popup: 'promo', after: 60, afterPageChange: true },
    { popup: 'promo', after: 180 },
    { popup: 'promo', after: 180 },
  ]);

  /* ── OPCJONALNIE: cisza dłuższa niż jedna wizyta ─────────────
     Domyślnie nowa sesja przeglądarki startuje sekwencję od nowa.
     Jeśli po czwartym pokazie ma być spokój np. przez dobę, użyj
     wersji poniżej zamiast tej powyżej — po ostatnim zamknięciu
     zapisuje cookie, które blokuje popup przy kolejnych wizytach.

  var promo = digi2.popups.get('promo');
  var seq = digi2.popups.sequence([
    { popup: 'promo', after: 4 },
    { popup: 'promo', after: 60, afterPageChange: true },
    { popup: 'promo', after: 180 },
    { popup: 'promo', after: 180 },
  ]);
  promo.options.cookieDurationDays = 1;              // ← czas ciszy w dniach
  promo.options.onClose = function () {
    if (seq.status().done) promo.markSeen();         // po ostatnim pokazie
  };
  */

  /* ── PODGLĄD W KONSOLI ───────────────────────────────────────
     digi2.debug = true    → logi modułu
     Stan łańcucha:  var seq = digi2.popups.sequence([...]); seq.status();
     seq.reset()           → zaczyna łańcuch od nowa */

});
</script>
