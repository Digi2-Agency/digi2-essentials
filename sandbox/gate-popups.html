<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sandbox: bramka wydania — d2-popups + d2-datalayer</title>

<!--
  Strona kontroli przed wydaniem (tests/browser/gate.spec.js). Moduły idą
  z dist/, czyli dokładnie to, co pójdzie na CDN po tagu. Układ jak w README
  „Webflow setup": .popup__overlay, .popup-close, d2-show-popup="promo".

  Ręcznie: npm run sandbox  ->  http://localhost:5179/sandbox/gate-popups.html
-->

<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #fbfaf8; color: #1a1d1c; font: 16px/1.5 "DejaVu Sans", Arial, sans-serif; }
  .strona { max-width: 520px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 16px; }
  button { padding: 10px 18px; border: 0; border-radius: 8px; background: #1f6f5c; color: #fff; font: inherit; cursor: pointer; }
  .popup__overlay { display: none; position: fixed; inset: 0; background: rgba(20, 24, 22, 0.55); align-items: center; justify-content: center; padding: 16px; }
  .popup__box { position: relative; width: 100%; max-width: 380px; background: #fff; border-radius: 14px; padding: 24px; }
  .popup__box h2 { margin: 0 0 8px; font-size: 20px; }
  .popup-close { position: absolute; top: 8px; right: 8px; width: 32px; height: 32px; padding: 0; background: #eee; color: #1a1d1c; border-radius: 50%; }
</style>

<script src="../dist/digi2-loader.min.js" d2-popups d2-datalayer></script>
</head>
<body>
<div class="strona">
  <h1>Popup testowy</h1>
  <p>Przycisk otwiera popup „promo" przez <code>d2-show-popup</code>.</p>
  <button id="otworz" d2-show-popup="promo">Pokaż ofertę</button>
</div>

<div class="popup__overlay" id="promo">
  <div class="popup__box" role="dialog" aria-label="Oferta">
    <button class="popup-close" aria-label="Zamknij">×</button>
    <h2>Oferta testowa</h2>
    <p>Treść popupu w sandboksie. Nic tu nie jest prawdziwe.</p>
  </div>
</div>

<script>
  digi2.onReady(function () {
    digi2.popups.create('promo', {
      animation: 'fade',
      animationDuration: 0.2,
      closeTriggerSelector: '.popup-close',
    });
  });
</script>
</body>
</html>
