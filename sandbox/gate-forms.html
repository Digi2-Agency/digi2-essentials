<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sandbox: bramka wydania — d2-forms + d2-datalayer</title>

<!--
  Strona kontroli przed wydaniem (tests/browser/gate.spec.js). Moduły idą
  z dist/, czyli dokładnie to, co pójdzie na CDN po tagu.

  Formularz jest fikcyjny i nigdzie nie wysyła danych: action="#", a zamiast
  webflow.js działa tu mała atrapa (na dole), która robi to samo co Webflow po
  udanym wysłaniu: ukrywa <form> i pokazuje .w-form-done. Test dodatkowo
  przerywa każde żądanie spoza localhost i pada, gdy jakieś było.

  Ręcznie: npm run sandbox  ->  http://localhost:5179/sandbox/gate-forms.html
-->

<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #fbfaf8; color: #1a1d1c; font: 16px/1.5 "DejaVu Sans", Arial, sans-serif; }
  .strona { max-width: 520px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 16px; }
  .w-form { background: #fff; border: 1px solid #e5e3df; border-radius: 12px; padding: 20px; }
  .pole { position: relative; margin-bottom: 26px; }
  label.etykieta { display: block; font-size: 14px; margin-bottom: 4px; }
  input[type=text], input[type=email] { width: 100%; padding: 10px 12px; border: 1px solid #c9c6c0; border-radius: 8px; font: inherit; background: #fff; color: inherit; }
  .zgoda { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; margin-bottom: 20px; }
  button { padding: 10px 18px; border: 0; border-radius: 8px; background: #1f6f5c; color: #fff; font: inherit; cursor: pointer; }
  .w-form-done, .w-form-fail { display: none; padding: 16px; border-radius: 8px; }
  .w-form-done { background: #e3f1ec; }
  .w-form-fail { background: #fbe7e4; }
  input { caret-color: transparent; }
</style>

<script src="../dist/digi2-loader.min.js" d2-forms d2-datalayer></script>
</head>
<body>
<div class="strona">
  <h1>Formularz testowy</h1>

  <div class="w-form" d2-form="kontakt">
    <form id="sandbox-form" action="#" method="post">
      <div class="pole">
        <label class="etykieta" for="NAME">Imię</label>
        <input type="text" id="NAME" name="NAME" autocomplete="off">
      </div>
      <div class="pole">
        <label class="etykieta" for="EMAIL">E-mail</label>
        <input type="email" id="EMAIL" name="EMAIL" autocomplete="off">
      </div>
      <label class="zgoda">
        <input type="checkbox" name="CONSENT_GDPR" d2-consent-item="kontakt">
        <span>Zgoda na kontakt (fikcyjna)</span>
      </label>
      <button type="submit" id="wyslij">Wyślij</button>
    </form>
    <div class="w-form-done">Dziękujemy! (atrapa Webflow)</div>
    <div class="w-form-fail">Coś poszło nie tak.</div>
  </div>
</div>

<script>
  digi2.onReady(function () {
    digi2.forms.create('kontakt', {
      validation: {
        NAME: { required: true, minLength: 2 },
        EMAIL: { required: true, email: true },
      },
      autoErrorElements: true,
    });
  });

  // Atrapa webflow.js: faza bubble, więc odpala się tylko wtedy, gdy walidacja
  // d2-forms (faza capture) przepuściła wysłanie — jak na prawdziwej stronie.
  document.getElementById('sandbox-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var form = e.currentTarget;
    var wrap = form.parentNode;
    setTimeout(function () {
      form.style.display = 'none';
      wrap.querySelector('.w-form-done').style.display = 'block';
    }, 50);
  });
</script>
</body>
</html>
